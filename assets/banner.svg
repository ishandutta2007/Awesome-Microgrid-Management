<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2027"/>
      <stop offset="100%" stop-color="#203a43"/>
    </linearGradient>

    <!-- Grid lines pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a8a" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Dynamic Energy Grid Animations -->
    <style>
      .power-line {
        stroke-dasharray: 12, 12;
        animation: flow 3s linear infinite;
      }
      .pulse-circle {
        animation: pulse 2.5s ease-in-out infinite alternate;
      }
      .pulse-circle-delayed {
        animation: pulse 2.5s ease-in-out 1.25s infinite alternate;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
      @keyframes flow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)" rx="12"/>
  <rect width="1200" height="300" fill="url(#grid)" rx="12"/>

  <!-- Dynamic Energy Grid Network Overlay (Background Dynamic Elements) -->
  <g opacity="0.4">
    <!-- Connecting Energy Waves / Grid Lines -->
    <path d="M 50 250 Q 200 180 400 230 T 800 200 T 1150 240" fill="none" stroke="#00f2fe" stroke-width="2" class="power-line" />
    <path d="M 50 80 Q 350 150 600 70 T 1150 90" fill="none" stroke="#10b981" stroke-width="2" class="power-line" />
    
    <!-- Background Animated Grid Nodes -->
    <circle cx="150" cy="120" r="4" fill="#00f2fe" class="pulse-circle"/>
    <circle cx="280" cy="220" r="5" fill="#10b981" class="pulse-circle-delayed"/>
    <circle cx="920" cy="80" r="6" fill="#3b82f6" class="pulse-circle"/>
    <circle cx="1050" cy="210" r="4" fill="#00f2fe" class="pulse-circle-delayed"/>

    <!-- Microgrid Icon Vector Accents (Left and Right sides) -->
    <!-- Solar & Storage Node (Left) -->
    <g transform="translate(70, 110)">
      <polygon points="0,-20 18,-10 18,10 0,20 -18,10 -18,-10" fill="none" stroke="#10b981" stroke-width="2"/>
      <path d="M -8 -5 L 8 5 M -8 5 L 8 -5" stroke="#10b981" stroke-width="1.5"/>
    </g>
    <!-- Wind & Battery Node (Right) -->
    <g transform="translate(1110, 140)">
      <polygon points="0,-25 22,-12 22,12 0,25 -22,12 -22,-12" fill="none" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#00f2fe" />
    </g>
  </g>

  <!-- Foreground Main Title & Subtitle Container -->
  <g text-anchor="middle" transform="translate(600, 0)">
    <!-- Main Title Shadow Backdrop -->
    <text x="0" y="122" class="title-text" font-size="44" fill="#10b981" opacity="0.4">AWESOME MICROGRID MANAGEMENT</text>
    
    <!-- Crisp Main Foreground Title (Unicode lightning replaced with clean SVG lightning icon if needed, or text) -->
    <text x="0" y="120" class="title-text" font-size="44" fill="#ffffff">AWESOME MICROGRID MANAGEMENT</text>
    
    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text" font-size="20" fill="#38bdf8">Top SaaS Platforms, DERMS, Open-Source EMS &amp; Power System Simulation Tools</text>

    <!-- Energy Badges Bar in Banner -->
    <g transform="translate(0, 195)">
      <!-- Badge 1: DERMS -->
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
        <text x="0" y="5" class="badge-text" fill="#10b981" text-anchor="middle">DERMS &amp; BESS</text>
      </g>
      <!-- Badge 2: OpenEMS -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
        <text x="0" y="5" class="badge-text" fill="#00f2fe" text-anchor="middle">OpenEMS Stack</text>
      </g>
      <!-- Badge 3: Simulation -->
      <g transform="translate(80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="0" y="5" class="badge-text" fill="#60a5fa" text-anchor="middle">Grid Simulation</text>
      </g>
      <!-- Badge 4: Optimization -->
      <g transform="translate(240, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
        <text x="0" y="5" class="badge-text" fill="#c084fc" text-anchor="middle">AI Optimization</text>
      </g>
    </g>
  </g>
</svg>
